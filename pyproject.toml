[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[project]
name = "lastlight"
version = "0.1.0"
description = "A sealed, camera-scored forecast of Phoenix twilight colour."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "colour-science>=0.4.7",
    "cryptography>=50.0.2",
    "eccodes>=2.49.0",
    # ecCodes needs a native library. The eccodes wheel names it (eccodeslib) as a dependency
    # only off Windows, and uv's universal lock reads that metadata from the Windows wheel, so
    # the lock would omit it. Listed here so macOS and Linux get the binary wheel, no system
    # packages. Windows wheels of eccodes bundle the library.
    "eccodeslib>=2.48 ; sys_platform != 'win32'",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pydantic>=2.14.0",
    "rasterio>=1.5.2",
    "rfc3161-client>=1.0.9",
    "scipy>=1.18.1",
]

[project.scripts]
lastlight = "lastlight.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not network'"
markers = [
    "network: needs real network access; deselected by default, run with `pytest -m network`",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["lastlight"]

[dependency-groups]
dev = [
    "pvlib>=0.16.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
]
