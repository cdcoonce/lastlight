# Tier A cameras: public webcams whose frames are lastlight's primary truth.
# Contract: docs/design.md sections 1 (truth tiers), 3 (third-party camera frames) and 4.
#
# Every camera needs: id (also its archive directory name), operator, page_url, image_url,
# view_azimuth_deg (degrees clockwise from true north), attribution, and a [camera.position].
# publish_thumbnails defaults to false, and true is refused unless `basis` says why publishing
# is acceptable. An unknown key is an error, so a typo cannot silently change a default.
#
# Positions are approximate and public: the operator's site names the town or landmark and
# publishes no coordinates, so each is the place named, rounded to 0.01 degrees (about 1 km).
# That is far finer than the collector needs: sun elevation changes about 0.01 degrees per km.

[[camera]]
id = "WHTM1"
operator = "Arizona Department of Environmental Quality (ADEQ), PhoenixVis"
page_url = "https://phoenixvis.net/site.aspx?site=whtm1"
image_url = "https://phoenixvis.net/images/photos-main/WHTM1.jpg"
view_azimuth_deg = 274
attribution = "Image source: Arizona Department of Environmental Quality, PhoenixVis (phoenixvis.net)"
publish_thumbnails = true
basis = "Public page; robots.txt allows all; ADEQ terms silent on automated use; owner decision 2026-10-10; removed on request"
position_note = "White Tank Mountains view, looking west from Avondale; place named by the operator, coordinates approximate"

[camera.position]
lat = 33.43
lon = -112.35
elev_m = 320

[[camera]]
id = "ESMO1"
operator = "Arizona Department of Environmental Quality (ADEQ), PhoenixVis"
page_url = "https://phoenixvis.net/site.aspx?site=esmo1"
image_url = "https://phoenixvis.net/images/photos-main/ESMO1.jpg"
view_azimuth_deg = 225
attribution = "Image source: Arizona Department of Environmental Quality, PhoenixVis (phoenixvis.net)"
publish_thumbnails = true
